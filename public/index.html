<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大富翁 · 世界银行</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 大厅 -->
<section id="lobby" class="screen">
  <div class="lobby-card">
    <div class="logo">
      <div class="logo-mark">🏦</div>
      <h1>大富翁</h1>
      <p class="sub">世界银行 · 刷卡版 · 2–8 人</p>
    </div>

    <div id="entry">
      <label class="field"><span>你的名字</span><input id="nameInput" maxlength="10" placeholder="例如 Jeremy"></label>
      <div class="field"><span>游戏人数</span><div class="seg" id="sizePick"></div></div>
      <label class="field"><span>创建密码（只有开房间的人需要，加入房间不用填）</span><input id="passInput" type="password" placeholder="创建房间的密码"></label>
      <button class="btn primary big" id="createBtn">创建房间</button>
      <div class="or"><span>或者</span></div>
      <div class="row">
        <input id="codeInput" maxlength="4" placeholder="房间号" class="code-input">
        <button class="btn big" id="joinBtn">加入</button>
      </div>
    </div>

    <div id="room" hidden>
      <div class="room-code">房间号 <b id="roomCode"></b></div>
      <p class="hint">把房间号发给朋友，大家打开同一个网址输入房间号即可加入</p>
      <p class="goal">🎯 <b>游戏目标</b>：每人起始 300M，<b>总资产</b>（现金 + 地产 + 房屋）最先达到 <b>1B</b> 的人获胜，游戏立即结束。破产的人出局，地产变成半价的"法拍房"。</p>
      <div class="size-line"><span id="sizeText"></span><div class="seg small" id="sizeEdit"></div></div>
      <div id="lobbyPlayers" class="lobby-players"></div>
      <div class="pickers">
        <div><span class="lbl">颜色</span><div id="colorPick" class="pick"></div></div>
        <div><span class="lbl">棋子</span><div id="iconPick" class="pick"></div></div>
      </div>
      <button class="btn primary big" id="startBtn">开始游戏</button>
      <p class="hint" id="waitHost" hidden>等待房主开始游戏…</p>
    </div>
    <p class="err" id="lobbyErr"></p>
  </div>
  <footer class="credit">Designed by Jeremy</footer>
</section>

<!-- 游戏 -->
<section id="game" class="screen" hidden>
  <div id="boardWrap">
    <div id="board">
      <div id="center">
        <div class="aurora"><i></i><i></i><i></i></div>
        <div class="center-title" id="title"></div>
        <div class="center-sub">WORLD BANK</div>
        <div id="status" class="status"></div>
        <div class="table">
          <div class="dice-box">
            <div id="diceTray" class="dice-tray">
              <div class="die" id="die0"></div>
              <div class="die" id="die1"></div>
            </div>
            <div id="diceSum" class="dice-sum"></div>
          </div>
          <div id="pos" class="pos">
            <div class="pos-slot"><div class="pos-slot-line"></div></div>
            <div class="pos-cardwrap"><div id="posCard" class="bank-card in-slot"></div></div>
            <div class="pos-screen"><div id="posLabel" class="pos-label">WORLD BANK</div><div id="posAmount" class="pos-amount">READY</div></div>
            <div class="pos-keys">
              <i>1</i><i>2</i><i>3</i><i>4</i><i>5</i><i>6</i><i>7</i><i>8</i><i>9</i><i class="k-red">−</i><i>0</i><i class="k-green">+</i>
            </div>
            <div class="pos-led" id="posLed"></div>
            <div class="pos-ring"></div>
            <div id="posPhone" class="pphone"><div class="pphone-s"></div></div>
            <div id="posCash" class="pcash"></div>
            <div id="posMini" class="pmini"></div>
          </div>
        </div>
        <div id="cardDock" class="card-dock"></div>
      </div>
    </div>
    <svg id="track"><path id="trackPath"/></svg>
    <div id="tokens"></div>
    <div id="banner" class="banner"></div>
  </div>

  <aside id="side">
    <div class="topbar">
      <span>房间 <b id="roomTag"></b> · ⏱ <b id="elapsed">0:00</b> · <span id="stageTag"></span></span>
      <div class="tools">
        <button id="btnHelp" title="快捷键 (H)">⌨️</button>
        <button id="btnMute" title="静音 (M)">🔊</button>
        <button id="btnTheme" title="夜间模式 (N)">🌙</button>
      </div>
    </div>
    <div id="players" class="panel players"></div>
    <div id="clock" class="clock"><span id="clockText"></span><div class="clock-bar"><div id="clockBar"></div></div></div>
    <div class="payrow"><span>付款用</span><div class="seg pay" id="payPick"><button data-pay="card">💳 卡</button><button data-pay="phone">📱 手机</button><button data-pay="cash">💵 现金</button></div><span>收款进</span><div class="seg pay" id="recvPick"><button data-recv="card">💳</button><button data-recv="phone">📱</button><button data-recv="cash">💵</button></div></div>
    <div id="actions" class="panel actions"></div>
    <div id="assets" class="panel assets"></div>
    <div class="panel log-panel"><div class="panel-title">动态</div><div id="log" class="log"></div></div>
  </aside>
</section>

<div id="danger" class="danger-screen" hidden><div class="danger-label">⚠️ 濒临破产 · 请立即卖房、抵押或出售地产</div></div>
<div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
<div id="local" class="modal" hidden><div class="modal-box" id="localBox"></div></div>
<div id="cardStage" class="card-stage" hidden></div>
<div id="floats"></div>
<div id="bigwin" class="bigwin"></div>
<div id="confetti"></div>
<div id="toast" class="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="data.js"></script>
<script src="landmarks.js"></script>
<script src="app.js"></script>
</body>
</html>
